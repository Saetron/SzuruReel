version: '3.8'

services:
  szuru-reel:
    build:
      context: .
      dockerfile: Dockerfile
    image: szuru-reel:latest
    container_name: szuru-reel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- Szurubooru Connection Configuration ---
      # Base URL of your Szurubooru instance (no trailing slash)
      - SZURU_URL=https://booru.example.com
      # Optional: Media/image upstream URL if distinct from API (e.g. if API is a backend port lacking static file routes)
      # - SZURU_MEDIA_URL=https://booru.example.com
      # Optional: Local mounted data directory (e.g. /data) for direct file streaming from storage
      # - SZURU_DATA_DIR=/data
      # Route API requests through the container's built-in proxy (recommended: prevents browser CORS restrictions)
      - SZURU_USE_PROXY=true
      # Default safety filter for feed: all, safe, sketchy, unsafe
      - SZURU_DEFAULT_SAFETY=all
      # Default video audio playback: false (muted), true (unmuted if browser allows)
      - SZURU_AUTOPLAY_SOUND=false
      # Default sort order: date-desc, date-asc, score-desc, random
      - SZURU_DEFAULT_SORT=date-desc
      # Container server port
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
